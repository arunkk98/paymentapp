name: CI & DevSecOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for SonarQube analysis

      # 1. SAST Code Analysis (Cloud-based, 0 cluster load)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 2. Build Docker Image locally inside CI runner
      - name: Build Payment Service Image
        run: |
          docker build -t payment-service:${{ github.sha }} src/payment-service

      # 3. Trivy Vulnerability Scan on Built Image
      - name: Run Trivy Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'payment-service:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fails CI if HIGH or CRITICAL CVEs exist
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      # 4. Push to Registry ONLY if all scans pass
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and Push Image
        run: |
          docker tag payment-service:${{ github.sha }} ghcr.io/${{ github.repository }}/payment-service:${{ github.sha }}
          docker push ghcr.io/${{ github.repository }}/payment-service:${{ github.sha }}
