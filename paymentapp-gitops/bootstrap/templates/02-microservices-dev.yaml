apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-service-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/arunkk98/paymentapp.git'
    targetRevision: main
    path: paymentapp-gitops/apps/payment-service/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: payment-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notification-service-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/arunkk98/paymentapp.git'
    targetRevision: main
    path: paymentapp-gitops/apps/notification-service/overlays/dev
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: payment-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
